<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WiszMe — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% -10%, #241B3D 0%, #141127 55%, #0B0A14 100%);
      color: #CFC8E8;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { color: #CFC8E8; opacity: 0.7; max-width: 320px; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>✨</h1>
  <h1>You're offline</h1>

</html>
